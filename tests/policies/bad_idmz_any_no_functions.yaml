# An 'idmz'-typed conduit using 'protocols: [any]' with no 'functions' restriction -- rejected: a
# declared IT-OT/iDMZ crossing must name exactly which protocol(s) (and, where supported,
# functions) it permits (docs/USER_GUIDE.md's POLICY FILE FORMAT section).
zones:
  hmi_zone:
    networks: [192.168.1.50/32]
  plc_zone:
    networks: [192.168.1.10/32]

conduits:
  - name: "c1"
    type: idmz
    from: hmi_zone
    to: plc_zone
    protocols: [any]
