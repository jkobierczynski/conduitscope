# Exercises ZoneKind::Hostname (docs/USER_GUIDE.md's POLICY FILE FORMAT section): zones addressed
# by hostname instead of CIDR/VLAN, matched against a flow's client/server IP only via a pinned
# --hosts file (never live DNS -- see resolver.hpp's own file header). Hostnames here match
# tests/hosts_sample.txt exactly ("plc-01"/"hmi-01" for the synthetic fixtures' PLC_IP/HMI_IP).
# A hostname-zone conduit behaves exactly like a CIDR-zone conduit (ports/functions all apply).
zones:
  hmi_zone:
    description: "HMI / engineering workstation, addressed by hostname"
    hostnames: [hmi-01]
  plc_zone:
    description: "PLC, addressed by hostname"
    hostnames: [plc-01]

conduits:
  - name: "HMI polls PLC via Modbus"
    from: hmi_zone
    to: plc_zone
    protocols: [modbus]
    ports: [502]
