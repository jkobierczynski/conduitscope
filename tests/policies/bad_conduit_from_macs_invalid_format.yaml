# Regression fixture: a 'from_macs' entry that isn't a valid MAC address (Phase 5, see
# docs/design/policy-engine-zoning.md) -- exactly six colon-separated hex octets are required, the
# same strict-input posture parse_cidr already takes toward a malformed network/prefix.
zones:
  ot_vlan:
    vlans: [100]
conduits:
  - name: c1
    from: ot_vlan
    to: ot_vlan
    protocol: any
    from_macs: [not-a-mac-address]
