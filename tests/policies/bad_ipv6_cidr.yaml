# Regression fixture: a malformed IPv6 CIDR entry ('zz' is not hex) in a zone's 'ipv6_networks'
# -- must be rejected with a clear, line-numbered PolicyError rather than silently accepted or
# crashing, mirroring bad_cidr.yaml's own IPv4 case.
zones:
  z1:
    ipv6_networks: ["2001:db8::zz"]
conduits:
  - name: c1
    from: z1
    to: z1
    protocols: [any]
