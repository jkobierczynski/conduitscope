# Exercises Conduit::conduit_type ("idmz" -- docs/USER_GUIDE.md's POLICY FILE FORMAT section): a
# valid IT-OT/iDMZ crossing conduit, explicit about its one protocol, so it passes the "no
# unrestricted 'any' with no 'functions'" validation rule. Otherwise identical to compliant.yaml.
zones:
  hmi_zone:
    description: "HMI / engineering workstation (synthetic fixtures' HMI_IP)"
    networks:
      - 192.168.1.50/32
  plc_zone:
    description: "PLC (synthetic fixtures' PLC_IP)"
    networks: [192.168.1.10/32]

conduits:
  - name: "HMI polls PLC via Modbus (iDMZ crossing)"
    type: idmz
    from: hmi_zone
    to: plc_zone
    protocols: [modbus]
    ports: [502]
