# A conduit mixing a hostname zone and a CIDR zone -- every zone a conduit references, on either
# side, must be the same kind (see docs/USER_GUIDE.md's POLICY FILE FORMAT section).
zones:
  hmi_zone:
    networks: [192.168.1.50/32]
  plc_zone:
    hostnames: [plc-01]

conduits:
  - name: "c1"
    from: hmi_zone
    to: plc_zone
    protocols: [modbus]
