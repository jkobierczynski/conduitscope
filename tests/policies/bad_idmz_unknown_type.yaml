# A conduit 'type' that isn't 'idmz' (the only recognized value so far) -- rejected
# (docs/USER_GUIDE.md's POLICY FILE FORMAT section).
zones:
  hmi_zone:
    networks: [192.168.1.50/32]
  plc_zone:
    networks: [192.168.1.10/32]

conduits:
  - name: "c1"
    type: dmz
    from: hmi_zone
    to: plc_zone
    protocols: [modbus]
