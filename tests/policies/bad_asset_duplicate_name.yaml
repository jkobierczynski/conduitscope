zones:
  hmi_zone:
    networks: [192.168.1.50/32]
  plc_zone:
    networks: [192.168.1.10/32]

conduits:
  - name: "HMI polls PLC via Modbus"
    from: hmi_zone
    to: plc_zone
    protocols: [modbus]
    ports: [502]

assets:
  - name: engineering_workstation
    ips: [192.168.1.50, 10.0.0.50]
  - name: engineering_workstation
    ips: [192.168.1.51, 10.0.0.51]
