name: CI

# Build + full CTest suite across compilers and build types, PLUS (see the `sanitizers` job) an
# ASan/UBSan-instrumented build running the same suite plus every fuzz harness's own bounded
# corpus-regression check on every push/PR, and (see `scheduled-fuzz`) materially longer, dedicated
# per-harness fuzzing campaigns on a nightly schedule. See docs/DEVELOPMENT.md's "External code
# review and engineering priorities" section (ROADMAP items 2 and 6) for the reasoning and the
# adopted order (CI first, sanitizers/fuzzing next -- this workflow -- the decoder
# registration-model refactor after that).

on:
  push:
    branches: ["**"]
    # Also run on a version tag (e.g. `git tag v0.1.0 && git push origin
    # v0.1.0`), so cutting a release gets the same build-and-test
    # verification as an ordinary push -- `branches` and `tags` are
    # independent filters under one `push:` trigger, so this doesn't
    # change when branch pushes fire, it only adds tag pushes matching
    # this pattern. Doesn't also trigger on GitHub's separate "Release
    # published" event (on: release), since publishing a Release from an
    # already-pushed tag would otherwise fire this workflow twice for the
    # same commit.
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
  schedule:
    # Drives the scheduled-fuzz job below only (every other job here is gated to push/pull_request/
    # workflow_dispatch and simply doesn't run on this trigger) -- an arbitrary off-peak time, not
    # the top of the hour, per GitHub's own guidance that top-of-hour schedules see the most queuing
    # delay from every other repository's workflow all requesting the same minute.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Npcap SDK (distinct from the Npcap runtime installer end users need to actually run a
  # live capture -- see docs/USER_GUIDE.md's "Build time vs. run time" note) has no package-
  # manager distribution, so the Windows release job below downloads this exact version's zip
  # directly from npcap.com. Bump this deliberately, not automatically -- npcap.com doesn't
  # version-pin old releases at a stable URL indefinitely, so an untested bump here can silently
  # break the next tagged release's Windows leg. 1.16 is confirmed working (this project's own
  # first real Windows/MSVC build, with live capture enabled, was done against it).
  NPCAP_SDK_VERSION: "1.16"

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    # The nightly schedule trigger above exists only to drive scheduled-fuzz below -- this job
    # already runs on every push/PR, so re-running it nightly too would just be redundant runner
    # time for zero new signal.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # libpcap-dev is the only external dependency this project has (CLI11
      # is vendored under third_party/, and the YAML policy-file parser is
      # hand-rolled in src/yaml_mini.cpp) -- installing it builds the live
      # capture path (CONDUITSCOPE_HAVE_PCAP=1) in addition to the
      # offline-pcap path every job exercises regardless.
      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # Opening a live capture (pcap_activate) needs CAP_NET_RAW even on
      # loopback, and the GitHub-hosted runner doesn't run as root, so the
      # 4 live_capture_* tests that actually open "lo" (as opposed to just
      # validating arguments or enumerating interfaces) fail with "You
      # don't have permission to perform this capture on that device"
      # otherwise. Granting the built binary the specific capability it
      # needs -- rather than running the whole test suite under sudo --
      # keeps everything else at normal privilege. This mirrors what a
      # real deployment would do (setcap once, or run under a service
      # account with that capability) instead of requiring root/sudo for
      # every invocation, which is the same fix for a local dev machine
      # that needs sudo for these tests today.
      - name: Grant the capture binary CAP_NET_RAW/CAP_NET_ADMIN
        run: |
          sudo apt-get install -y libcap2-bin
          sudo setcap cap_net_raw,cap_net_admin=eip build/conduitscope
          getcap build/conduitscope

      - name: Test
        working-directory: build
        run: ctest -j"$(nproc)" --output-on-failure

  sanitizers:
    # The "folded into the same CI matrix" half of docs/DEVELOPMENT.md's ROADMAP item 6: an
    # ASan/UBSan-instrumented build of conduitscope_core (and therefore the conduitscope CLI binary
    # itself, which links it -- see CMakeLists.txt's CONDUITSCOPE_ENABLE_FUZZING block for why),
    # running the SAME full CTest suite build-and-test does, plus all 76 fuzz_*_corpus_regression
    # tests CMakeLists.txt also registers in this configuration -- each a short (10s), bounded
    # libFuzzer run over that harness's own committed seed corpus, not a real fuzzing campaign (see
    # scheduled-fuzz below for that). This runs on every push/PR specifically because CI without
    # sanitizers wired in mostly proves the code still compiles, not that it's memory-safe -- see
    # this workflow's own top comment and docs/DEVELOPMENT.md's "the one gap weighted more heavily
    # here than in the review's own ordering" section for why this was judged the sharper near-term
    # risk versus polish, for a tool whose entire input surface is attacker-reachable capture bytes.
    name: Clang / ASan+UBSan + fuzz corpus regression
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # libclang-rt-dev is the metapackage that tracks whatever compiler-rt build matches this
      # runner image's default `clang`/`clang++` (avoids hardcoding a versioned package name like
      # libclang-rt-18-dev that would go stale the next time the runner image's default Clang
      # bumps) -- it provides both the ASan/UBSan runtime and libFuzzer itself.
      - name: Install libpcap and the Clang sanitizer/fuzzer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libclang-rt-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCONDUITSCOPE_ENABLE_FUZZING=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # Split around a privilege boundary, deliberately -- root-caused with a real CI run plus
      # digging into how AddressSanitizer actually reads ASAN_OPTIONS. The first attempt here used
      # setcap (build-and-test's own approach) plus ASAN_OPTIONS=detect_leaks=0 for just the
      # CAP_NET_RAW-needing slice, on the theory that setcap's non-dumpable side effect was
      # blocking LeakSanitizer's own ptrace-based stop-the-world. That was directionally right but
      # incomplete: ASan doesn't read ASAN_OPTIONS via a normal environment lookup, it reads
      # /proc/self/environ -- and setcap's non-dumpable transition makes THAT file root-owned,
      # mode 0400 (a deliberate kernel protection against a privileged process leaking its
      # environment to whoever invoked it), which an unprivileged runner user can't read even for
      # its OWN process. So ASAN_OPTIONS=detect_leaks=0 was being silently dropped -- confirmed via
      # google/sanitizers#784, a known report of exactly this -- and LeakSanitizer ran with its
      # default (detect_leaks=1) regardless, hence the still-intermittent crash on the very tests
      # that setcap'd override was supposed to fix (it depended on how much each test had exited by
      # the time LSan's exit hook fired, not on the override actually working).
      #
      # Fix: don't rely on setcap + an environment override reaching a non-dumpable process at all
      # for this narrow slice. Everything that doesn't need CAP_NET_RAW runs first, as the normal
      # unprivileged user, with full leak detection genuinely intact (confirmed reachable this
      # time, since nothing here is non-dumpable). Only the 4 tests that genuinely need it (see
      # CMakeLists.txt's own comment for exactly which "actually open lo") run afterward under
      # `sudo --preserve-env`, not setcap -- root can always read its own /proc/self/environ
      # (root bypasses the same DAC check that blocks everyone else), so ASAN_OPTIONS reliably
      # reaches the process this way, and root has every capability implicitly anyway, so no
      # separate setcap step is needed for this job at all (build-and-test's own setcap'd,
      # non-ASan run already covers "does this work for an ordinary capability-holding,
      # non-root process", which is unaffected by any of this since it has no LeakSanitizer to
      # conflict with).
      - name: Test everything that doesn't need CAP_NET_RAW (full leak detection)
        working-directory: build
        run: >
          ctest -j"$(nproc)" --output-on-failure
          -E "^(live_capture_invalid_filter_reports_clearly|live_capture_duration_stops_cleanly_with_no_traffic|live_capture_policy_validate_duration_stops_cleanly|live_capture_max_packets_stops_capture_early_with_real_traffic)$"

      - name: Test the CAP_NET_RAW-needing live-capture tests (under sudo -- see above)
        working-directory: build
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: >
          sudo --preserve-env=ASAN_OPTIONS
          ctest -j"$(nproc)" --output-on-failure
          -R "^(live_capture_invalid_filter_reports_clearly|live_capture_duration_stops_cleanly_with_no_traffic|live_capture_policy_validate_duration_stops_cleanly|live_capture_max_packets_stops_capture_early_with_real_traffic)$"

  release-windows:
    # Windows counterpart to build-and-test/build-without-libpcap above, but scoped to tag pushes
    # only (see NPCAP_SDK_VERSION's own comment for why this doesn't run on every ordinary push --
    # it's a deliberate scope decision, not an oversight, since the SDK download and a second full
    # CTest run add real runner time that only matters when a release is actually being cut).
    # Combines what the Linux side keeps as two separate jobs (build-and-test's matrix, and
    # release's own fresh version-overridden build) into one, since here they'd otherwise rebuild
    # and re-download the SDK twice for no benefit: this job both gates the release (the full
    # CTest suite must pass -- Windows has never had CI coverage before this) AND produces the
    # exact binary that gets packaged and attached to the release, built once under
    # CONDUITSCOPE_VERSION_OVERRIDE so the tested binary and the shipped binary are the same
    # artifact, not two separate builds that could in principle drift.
    #
    # No `-G`/generator is pinned deliberately: this project's own first real Windows build this
    # session hit a generator-name mismatch (a machine with only Visual Studio 2026 installed
    # rejected the hardcoded "Visual Studio 17 2022" name) -- letting CMake auto-detect whichever
    # single VS install the windows-latest image actually ships avoids re-hardcoding a version
    # that will eventually go stale the same way.
    name: Windows (Release, live capture)
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # actions/upload-artifact needs `actions: write` on the job token once the workflow-level
    # `permissions:` block above has switched every job to the restrictive "unlisted scopes are
    # none" model (see the `release` job's own `permissions:` block below for the download-side
    # counterpart, `actions: read`).
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          $tag = $env:GITHUB_REF_NAME
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Download and extract the Npcap SDK
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://npcap.com/dist/npcap-sdk-${env:NPCAP_SDK_VERSION}.zip"
          Invoke-WebRequest -Uri $url -OutFile npcap-sdk.zip
          Expand-Archive -Path npcap-sdk.zip -DestinationPath npcap-sdk
          "NPCAP_SDK_DIR=$(Resolve-Path npcap-sdk)" >> $env:GITHUB_ENV

      # Same override this repo's own version.hpp.in documents (see CMakeLists.txt) -- the
      # published binary's `conduitscope version` output always matches the tag it shipped
      # under. -A x64 pins the target architecture explicitly since the runner's default CMake
      # generator choice doesn't otherwise guarantee which platform it defaults to.
      - name: Configure
        run: >
          cmake -S . -B build
          -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DCONDUITSCOPE_VERSION_OVERRIDE=${{ steps.version.outputs.version }}
          -DNPCAP_SDK_DIR="${env:NPCAP_SDK_DIR}"

      # A hard failure, not a warning: this job's whole point is a live-capture-enabled Windows
      # binary (see the job name), so a silently pcap-less build here would ship a release
      # artifact that quietly doesn't do what it says -- worse than failing loudly and fixing the
      # SDK download/NPCAP_SDK_DIR wiring above.
      - name: Confirm live capture was actually detected
        run: |
          $config = Get-Content build/CMakeCache.txt -Raw
          if ((Select-String -InputObject $config -Pattern "wpcap" -Quiet) -eq $false) {
            throw "wpcap.lib not found in CMakeCache.txt -- live capture was NOT enabled for this build (see the Configure step's own log above)"
          }

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        working-directory: build
        # --timeout is a safety net, not the fix for the missing-Npcap-runtime hang this job used
        # to have (see live_capture.cpp's ensure_pcap_runtime_available and the /DELAYLOAD comment
        # in CMakeLists.txt for that): if any test ever does genuinely wedge, this converts it into
        # a fast, clearly-attributed failure instead of silently eating the whole job's time budget.
        run: ctest -C Release -j 4 --output-on-failure --timeout 120

      - name: Verify reported version matches the tag
        run: |
          $reported = & build\Release\conduitscope.exe version
          Write-Host $reported
          if ($reported -notmatch "conduitscope ${{ steps.version.outputs.version }} ") {
            throw "version output did not match the tag"
          }

      - name: Package
        id: package
        run: |
          $ErrorActionPreference = "Stop"
          $name = "conduitscope-${{ steps.version.outputs.version }}-windows-x86_64"
          $staging = "staging\${name}"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item build\Release\conduitscope.exe "$staging\"
          Copy-Item README.md, LICENSE "$staging\"
          Copy-Item docs "$staging\docs" -Recurse
          Compress-Archive -Path $staging -DestinationPath "${name}.zip"
          $hash = (Get-FileHash "${name}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${name}.zip" | Out-File -Encoding ascii "${name}.zip.sha256"
          "archive=${name}.zip" >> $env:GITHUB_OUTPUT
          "checksum=${name}.zip.sha256" >> $env:GITHUB_OUTPUT

      # Handed off to the `release` job below rather than published directly from here, so there
      # is exactly one place (`release`) that decides whether a Release gets created/updated for
      # this tag -- same reasoning as the existing linux-release/windows-release split avoiding
      # two independent `gh release create` calls racing each other.
      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-binary
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

  release:
    # Only for a version-tag push (v0.1.1, v1.2.3, ...), and only once every
    # leg of build-and-test / build-without-libpcap / release-windows has
    # already passed for this exact commit -- a release is never published
    # from code CI hasn't verified. Builds a fresh Linux Release binary (not
    # reused from the matrix above -- simpler and more obviously
    # reproducible than downloading one matrix leg's artifact), packages it
    # with the docs/README/LICENSE/man page (this is an OT-audit tool, and
    # the people running it are often on an air-gapped or restricted network
    # without a browser open to GitHub, so the docs travel with the binary
    # rather than staying link-only), downloads the Windows binary
    # release-windows already built and packaged, and publishes ONE GitHub
    # Release for the tag with both platforms' archives attached.
    name: Publish release
    needs: [build-and-test, build-without-libpcap, release-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # `actions: read` is needed for actions/download-artifact below, on top of the `contents:
    # write` this job already needed to publish the Release itself -- see release-windows' own
    # permissions comment for the upload-side counterpart.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Explicitly overrides CMakeLists.txt's own hardcoded PROJECT_VERSION
      # with the pushed tag (see CMakeLists.txt's own comment on
      # CONDUITSCOPE_VERSION_OVERRIDE) -- so `conduitscope version` in the
      # published binary always matches the tag it shipped under, even if
      # bumping the CMakeLists.txt version was forgotten before tagging.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCONDUITSCOPE_VERSION_OVERRIDE=${{ steps.version.outputs.version }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Verify reported version matches the tag
        run: |
          reported="$(build/conduitscope version)"
          echo "$reported"
          echo "$reported" | grep -q "conduitscope ${{ steps.version.outputs.version }} "

      - name: Package
        id: package
        run: |
          set -euo pipefail
          name="conduitscope-${{ steps.version.outputs.version }}-linux-x86_64"
          staging="/tmp/${name}"
          mkdir -p "${staging}"
          strip -o "${staging}/conduitscope" build/conduitscope
          cp -r README.md LICENSE docs man "${staging}/"
          tar -C /tmp -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "archive=${name}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=${name}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: windows-release-binary
          path: windows-release-binary

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          # Idempotent: `gh release create` errors with "a release with the
          # same tag name already exists" if a Release for this tag is
          # already published -- which happens if this job is re-run (e.g.
          # via "Re-run jobs" after an earlier success) or the tag was
          # deleted and re-pushed to redo a release. Rather than failing the
          # job, treat an already-published Release for this tag as done and
          # skip re-publishing -- the existing Release (and its assets) are
          # left untouched.
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; skipping publish."
            exit 0
          fi
          gh release create "${tag}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.checksum }}" \
            windows-release-binary/* \
            --title "conduitscope ${{ steps.version.outputs.version }}" \
            --generate-notes

  build-without-libpcap:
    # A second, smaller leg with live capture explicitly disabled, so the
    # "libpcap/Npcap not found" stub path (live_capture.cpp's #else branch,
    # and the CTest cases gated on `NOT CONDUITSCOPE_HAVE_PCAP`) gets
    # exercised too, not just the common case every matrix leg above already
    # covers.
    name: gcc / Release (live capture disabled)
    runs-on: ubuntu-latest
    # See build-and-test's own identical guard -- the nightly schedule trigger only exists to
    # drive scheduled-fuzz below.
    if: github.event_name != 'schedule'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure (live capture explicitly disabled)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCONDUITSCOPE_ENABLE_LIVE_CAPTURE=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        working-directory: build
        run: ctest -j"$(nproc)" --output-on-failure

  scheduled-fuzz:
    # The other half of docs/DEVELOPMENT.md's ROADMAP item 6: materially longer, dedicated
    # campaigns against each harness's OWN growing seed corpus (fuzz/corpus/<name>/), as opposed to
    # the sanitizers job's few-seconds-per-harness smoke regression on every push/PR above. Runs on
    # the nightly cron trigger (see this workflow's own `on:` block) rather than per-push, since
    # minutes-per-harness doesn't belong gating an ordinary push/PR -- also manually triggerable via
    # workflow_dispatch, e.g. right after hand-extending a corpus per docs/fuzz/README.md.
    name: Scheduled fuzz campaign / ${{ matrix.harness }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # actions/upload-artifact (for a crash reproducer, below) needs `actions: write` once the
    # workflow-level `permissions:` block has switched every job to the restrictive model -- same
    # reasoning as release-windows' own identical addition.
    permissions:
      contents: read
      actions: write
    # A separate, ref-agnostic concurrency group from the workflow-level default (keyed on
    # github.ref, cancel-in-progress: true): that default would cancel an in-progress scheduled
    # campaign the moment anyone pushes to the same branch while it's running, which defeats the
    # point of a dedicated longer run. This group is per-harness instead, so ordinary pushes never
    # touch it, and cancel-in-progress: false means two overlapping runs of the SAME harness (e.g.
    # a manual workflow_dispatch landing during the nightly cron) queue rather than clobber each
    # other.
    concurrency:
      group: scheduled-fuzz-${{ matrix.harness }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      # GitHub's default per-workflow-run concurrent-job cap (20 on standard GitHub-hosted
      # runners) applies to this matrix same as any other -- not raised or lowered here -- so 76
      # legs run in ceil(76/20) = 4 waves rather than 76x sequentially, roughly 40 minutes of
      # wall time total for a 10-minute-per-harness campaign. Free for a public repository
      # (unlimited GitHub-hosted Actions minutes), so this isn't trading budget for coverage.
      matrix:
        # The full set of harnesses under fuzz/ -- kept in sync with CMakeLists.txt's own
        # add_conduitscope_fuzzer(...) registrations (76 as of the fuzzing-hardening batch, item
        # 56 in docs/DEVELOPMENT.md) -- see docs/DEVELOPMENT.md's "Fuzzing campaign log" table for
        # what each one covers and its dedicated-campaign history so far. This list grew from the
        # original 9 (pcap_reader through s7comm_plus) only after items 57/58 found real crashes
        # in fox and amqp10 -- two harnesses that were registered for the push/PR sanitizers job's
        # short corpus-regression check but NOT for this longer nightly campaign, so a matrix drift
        # like that is worth treating as a standing risk: add a new harness here in the SAME change
        # that adds it to CMakeLists.txt, not as a follow-up.
        harness:
          - amqp091
          - amqp10
          - arp
          - bacnet
          - bgp
          - bsap
          - can_socketcan
          - canopen
          - cclink_ie
          - cdp
          - coap
          - codesys
          - cotp_s7comm
          - dcerpc
          - dcom
          - devicenet
          - dhcpv6
          - dicom
          - dnp3
          - dns
          - drsuapi
          - eapol
          - eigrp
          - enip
          - ethercat
          - ffhse
          - fins
          - fox
          - ge_srtp
          - goose
          - hartip
          - homeplug_av
          - hsrp
          - icmp
          - icmpv6
          - iec104
          - ieee802154
          - igmp
          - igrp
          - j1939
          - kerberos
          - ldap
          - lldp
          - lsarpc
          - melsec
          - mms
          - modbus
          - mpls
          - mqtt
          - nbns
          - netlogon
          - ntlm
          - opcua
          - ospf
          - packet_decode
          - pcap_reader
          - pim
          - powerlink
          - pppoe
          - profinet
          - quic
          - rip
          - rmcp
          - s7comm_plus
          - samr
          - slow_protocols
          - smb
          - srvsvc
          - stp
          - sv
          - tls_sni
          - twincat
          - vrrp
          - winrm
          - wkssvc
          - zigbee
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install libpcap and the Clang sanitizer/fuzzer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libclang-rt-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCONDUITSCOPE_ENABLE_FUZZING=ON

      - name: Build fuzz_${{ matrix.harness }}
        run: cmake --build build -j"$(nproc)" --target "fuzz_${{ matrix.harness }}"

      # 10 minutes, single worker, per harness (76 harnesses run in parallel matrix legs, capped
      # at GitHub's default 20-concurrent-job limit -- see the matrix's own comment above -- not
      # 76x sequentially): proportionate to a nightly CI-hosted campaign without either starving
      # other GitHub Actions usage on this repository or ballooning this job's own wall-clock
      # time. Not a substitute for the longer, multi-worker, by-hand campaigns
      # docs/DEVELOPMENT.md's own "Fuzzing campaign log" table records -- this is a regular,
      # automated floor under those, not a replacement for them.
      - name: Run a 10-minute campaign against this harness's own corpus
        working-directory: build
        run: |
          "./fuzz_${{ matrix.harness }}" "../fuzz/corpus/${{ matrix.harness }}" \
            -max_total_time=600 -max_len=8192 -print_final_stats=1

      # libFuzzer writes a crash-<sha1> reproducer file into the working directory the moment it
      # finds one, and exits non-zero -- which is what actually fails the step above. Uploading it
      # here means a finding is downloadable straight from the failed run instead of needing to be
      # re-found by re-running the campaign locally.
      - name: Upload crash reproducer, if any
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.harness }}-crash
          path: build/crash-*
          if-no-files-found: ignore
          retention-days: 30
