name: CI

# Build + full CTest suite across compilers and build types. Deliberately does
# NOT run ASan/UBSan or any fuzzing yet -- that's the next planned step, not
# this one; see docs/DEVELOPMENT.md's "External code review and engineering
# priorities" section for the reasoning and the adopted order (CI first,
# sanitizers/fuzzing next, the decoder registration-model refactor after
# that).

on:
  push:
    branches: ["**"]
    # Also run on a version tag (e.g. `git tag v0.1.0 && git push origin
    # v0.1.0`), so cutting a release gets the same build-and-test
    # verification as an ordinary push -- `branches` and `tags` are
    # independent filters under one `push:` trigger, so this doesn't
    # change when branch pushes fire, it only adds tag pushes matching
    # this pattern. Doesn't also trigger on GitHub's separate "Release
    # published" event (on: release), since publishing a Release from an
    # already-pushed tag would otherwise fire this workflow twice for the
    # same commit.
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # libpcap-dev is the only external dependency this project has (CLI11
      # is vendored under third_party/, and the YAML policy-file parser is
      # hand-rolled in src/yaml_mini.cpp) -- installing it builds the live
      # capture path (CONDUITSCOPE_HAVE_PCAP=1) in addition to the
      # offline-pcap path every job exercises regardless.
      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # Opening a live capture (pcap_activate) needs CAP_NET_RAW even on
      # loopback, and the GitHub-hosted runner doesn't run as root, so the
      # 4 live_capture_* tests that actually open "lo" (as opposed to just
      # validating arguments or enumerating interfaces) fail with "You
      # don't have permission to perform this capture on that device"
      # otherwise. Granting the built binary the specific capability it
      # needs -- rather than running the whole test suite under sudo --
      # keeps everything else at normal privilege. This mirrors what a
      # real deployment would do (setcap once, or run under a service
      # account with that capability) instead of requiring root/sudo for
      # every invocation, which is the same fix for a local dev machine
      # that needs sudo for these tests today.
      - name: Grant the capture binary CAP_NET_RAW/CAP_NET_ADMIN
        run: |
          sudo apt-get install -y libcap2-bin
          sudo setcap cap_net_raw,cap_net_admin=eip build/conduitscope
          getcap build/conduitscope

      - name: Test
        working-directory: build
        run: ctest -j"$(nproc)" --output-on-failure

  release:
    # Only for a version-tag push (v0.1.1, v1.2.3, ...), and only once every
    # leg of build-and-test / build-without-libpcap has already passed for
    # this exact commit -- a release is never published from code CI hasn't
    # verified. Builds a fresh Release binary (not reused from the matrix
    # above -- simpler and more obviously reproducible than downloading one
    # matrix leg's artifact), packages it with the docs/README/LICENSE/man
    # page (this is an OT-audit tool, and the people running it are often on
    # an air-gapped or restricted network without a browser open to GitHub,
    # so the docs travel with the binary rather than staying link-only), and
    # publishes a GitHub Release for the tag with that tarball attached.
    name: Publish release
    needs: [build-and-test, build-without-libpcap]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install libpcap
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Explicitly overrides CMakeLists.txt's own hardcoded PROJECT_VERSION
      # with the pushed tag (see CMakeLists.txt's own comment on
      # CONDUITSCOPE_VERSION_OVERRIDE) -- so `conduitscope version` in the
      # published binary always matches the tag it shipped under, even if
      # bumping the CMakeLists.txt version was forgotten before tagging.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCONDUITSCOPE_VERSION_OVERRIDE=${{ steps.version.outputs.version }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Verify reported version matches the tag
        run: |
          reported="$(build/conduitscope version)"
          echo "$reported"
          echo "$reported" | grep -q "conduitscope ${{ steps.version.outputs.version }} "

      - name: Package
        id: package
        run: |
          set -euo pipefail
          name="conduitscope-${{ steps.version.outputs.version }}-linux-x86_64"
          staging="/tmp/${name}"
          mkdir -p "${staging}"
          strip -o "${staging}/conduitscope" build/conduitscope
          cp -r README.md LICENSE docs man "${staging}/"
          tar -C /tmp -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "archive=${name}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=${name}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ steps.version.outputs.tag }}"
          "${{ steps.package.outputs.archive }}"
          "${{ steps.package.outputs.checksum }}"
          --title "conduitscope ${{ steps.version.outputs.version }}"
          --generate-notes

  build-without-libpcap:
    # A second, smaller leg with live capture explicitly disabled, so the
    # "libpcap/Npcap not found" stub path (live_capture.cpp's #else branch,
    # and the CTest cases gated on `NOT CONDUITSCOPE_HAVE_PCAP`) gets
    # exercised too, not just the common case every matrix leg above already
    # covers.
    name: gcc / Release (live capture disabled)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure (live capture explicitly disabled)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCONDUITSCOPE_ENABLE_LIVE_CAPTURE=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        working-directory: build
        run: ctest -j"$(nproc)" --output-on-failure
